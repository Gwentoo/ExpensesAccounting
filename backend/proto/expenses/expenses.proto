syntax = "proto3";

package expenses;

option go_package = "expenses.v1;expensesv1";

import "google/api/annotations.proto";

import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Expenses Service";
    version: "1.0"
  };
  host: "localhost:8080";
  schemes: HTTP;
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Введите токен в формате: Bearer <JWT_TOKEN>";
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth";
    }
  }
};

service Expenses {
  rpc UploadStatement (UploadStatementRequest) returns (UploadStatementResponse) {
    option (google.api.http) = {
      post: "/v1/expenses/upload",
      body: "*"
    };
  };

  rpc GetSupersetToken (GetSupersetTokenRequest) returns (GetSupersetTokenResponse) {
    option (google.api.http) = {
      post: "/v1/expenses/superset-token",
      body: "*"
    };
  };

}

message UploadStatementRequest {
  string file_name = 1;
  bytes content = 2;
}

message UploadStatementResponse {
  bool success = 1;
  int32 processed_rows = 2;
}

message GetSupersetTokenRequest {
  string start_date = 1;
  string end_date = 2;
  string account_name = 3;
  string dashboard_id = 4;
}

message GetSupersetTokenResponse {
  string token = 1;
  string dashboard_id = 2;
}